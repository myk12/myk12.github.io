<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Yuke's Blog</title>
    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="blog-container">
        <nav class="blog-nav">
            <a href="{{ '/blog.html' | relative_url }}" class="blog-brand">Yuke Ma / Blog</a>
            
            <div class="blog-menu">
                <a href="{{ '/' | relative_url }}">Portfolio (Home)</a>
            </div>
        </nav>

        <main>
            {{ content }}
        </main>

        <footer style="margin-top: 80px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; font-family: 'Inter', sans-serif; font-size: 0.8rem; color: #999;">
            <p>&copy; {{ site.time | date: '%Y' }} Yuke Ma. <a href="{{ '/' | relative_url }}" style="color:#999; text-decoration:none;">Back to Main Site</a></p>
        </footer>
    </div>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

  document.addEventListener('DOMContentLoaded', async function () {
    // 1. 初始化
    mermaid.initialize({ 
      startOnLoad: false,
      theme: 'default', // 如果你是深色模式，可以改成 'dark'
    });

    // 2. 寻找 Jekyll 生成的 Mermaid 代码块
    // Jekyll 通常会生成 <div class="language-mermaid ...">
    const mermaidWrappers = document.querySelectorAll('.language-mermaid');

    // 3. 遍历并替换
    for (const wrapper of mermaidWrappers) {
      // 获取代码文本 (textContent 会自动处理 HTML 转义，比如 &gt; 变成 >)
      const content = wrapper.textContent.trim();

      // 创建一个新的 div 给 Mermaid
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = content;

      // 用新的图表 div 替换掉旧的代码块 div
      wrapper.parentNode.replaceChild(div, wrapper);
    }

    // 4. 执行渲染
    await mermaid.run();
  });
</script>

</body>
</html>
